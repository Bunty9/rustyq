[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/server",
    "crates/worker",
    "crates/pybind",
    "crates/client",
    "examples/order-pipeline",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bunty9/rustyq"
homepage = "https://github.com/Bunty9/rustyq"
keywords = ["queue", "job-queue", "postgres", "background-jobs", "worker"]
categories = ["asynchronous", "database"]

[workspace.dependencies]
# Runtime + HTTP
tokio = { version = "1.47", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip"] }
hyper = "1.5"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "json"] }

# gRPC
tonic = "0.12"
prost = "0.13"

# Observability — uniform across all projects
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Auth
jsonwebtoken = "9"
argon2 = "0.5"

# Concurrency primitives
arc-swap = "1.7"
parking_lot = "0.12"
crossbeam-skiplist = "0.1"

# Errors
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Python bindings
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
