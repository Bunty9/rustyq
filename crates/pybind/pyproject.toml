[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "rustyq"
dynamic = ["version"]
description = "Python client for the rustyq durable job queue (Rust-native, Postgres-backed)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
keywords = ["queue", "jobs", "rust", "postgres", "celery"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/Bunty9/rustyq"
Repository = "https://github.com/Bunty9/rustyq"
Issues = "https://github.com/Bunty9/rustyq/issues"

[tool.maturin]
module-name = "rustyq"
features = ["pyo3/extension-module"]
strip = true
